<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Hub - Links</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px;
        }
        .container { width: 100%; max-width: 500px; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 30px; color: var(--accent); }
        
        .link-card {
            background: var(--card);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            display: block;
        }
        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }
        .link-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text);
            display: block;
        }
        .link-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
            display: block;
        }
        .footer { margin-top: 40px; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Proxy & Game Links</h1>

        <a href="https://sites.google.com" class="link-card" target="_blank">
            <span class="link-title">VCSA - v6</span>
            <span class="link-desc">Google Site Proxy</span>
        </a>

        <a href="https://playernation1.blogspot.com" class="link-card" target="_blank">
            <span class="link-title">Player Nation</span>
            <span class="link-desc">just for fun</span>
        </a>

        <a href="https://bb-hub.blogspot.com" class="link-card" target="_blank">
            <span class="link-title">BB Hub</span>
            <span class="link-desc">Blogger Proxy</span>
        </a>

        <a href="https://multipleurlopen.com" class="link-card" target="_blank">
            <span class="link-title">MULTIPLE URL OPEN</span>
            <span class="link-desc">Bulk URL Opener Tool</span>
        </a>

        <a href="https://sites.google.com" class="link-card" target="_blank">
            <span class="link-title">IXL Education</span>
            <span class="link-desc">VCSA Educational Mirror</span>
        </a>

        <a href="https://sites.google.com" class="link-card" target="_blank">
            <span class="link-title">Classroom G'+</span>
            <span class="link-desc">Unblocked Games Hub</span>
        </a>

        <a href="https://sk-bytes.blogspot.com" class="link-card" target="_blank">
            <span class="link-title">SK BYTES</span>
            <span class="link-desc">Blogger Resource Site</span>
        </a>

        <div class="footer">
            Generated from Raindrop.io RSS
        </div>
    </div>

</body>
</html>
